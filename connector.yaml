        - { name: list_warehouses, description: "Sklady pripojenej prevádzky" }
        - { name: list_customers, description: "Zákazníci s pseudonymizovanými osobnými údajmi" }
        - { name: list_employees, description: "Zamestnanci a obsluha prevádzky s chránenými osobnými údajmi" }
        - { name: sales_summary, description: "Súhrn predajov za obdobie — tržby, doklady, priemerný bloček, top produkty a DPH" }
