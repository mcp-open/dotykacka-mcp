        - { name: list_customers, description: "Zákazníci s pseudonymizovanými osobními údaji" }
        - { name: list_employees, description: "Zaměstnanci a obsluha provozovny s chráněnými osobními údaji" }
        - { name: sales_summary, description: "Souhrn prodejů za období — tržby, doklady, průměrná účtenka, top produkty a DPH" }
