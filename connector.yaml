egress:
  host: "*.dotykacka.cz"
  port: 443
  path_prefix: /v2
  methods: [GET, POST]

# runtime — provisioning kontrakt pro connector-operator (app-driven onboarding).
# Deterministicky řídí tvar nasazeného manifestu (deploy/cluster/86-mcp-dotykacka.yaml):
#   pii_salt    → inject OPENMCP_PII_SALT secret (GDPR pseudonymizace)
#   health_path → httpGet {path} readiness/liveness (SDK obsluhuje /healthz)
#   vault_ttl   → env VAULT_TTL (s) — cache Vault tajemství; 5s kvůli reconnectu
# seed-manifests ho ignoruje (čte jen credentials/user_config/capabilities/display/auth).
runtime:
  pii_salt: true
  health_path: /healthz
  vault_ttl: 5
