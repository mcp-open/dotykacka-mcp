        - "Iba čítanie cez Dotykačka API v2 — konektor nezapisuje ani nemaže údaje"
        - "Prístup schválite prihlásením priamo pri Dotykačke a môžete ho znova odvolať"
      data_handling: "Osobné údaje zákazníkov a zamestnancov sa pred odoslaním do AI klienta pseudonymizujú stabilnými jednosmernými tokenmi. Predajné a katalógové údaje zostávajú čitateľné."
