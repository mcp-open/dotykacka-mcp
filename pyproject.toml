[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotykacka-mcp"
version = "0.1.0"
description = "Dotykačka / Dotypos POS (API v2) MCP konektor nad openmcp_sdk — delegovaná OAuth autorizace, read-only, GDPR pseudonymizace."
requires-python = ">=3.12"
dependencies = [
  "openmcp-sdk>=0.3,<0.4",
  "fastmcp>=2.11,<3",
  "pydantic>=2.6,<3",
  "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
