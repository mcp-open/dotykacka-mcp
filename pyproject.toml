[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotykacka-mcp"
version = "0.1.0"
description = "Dotykačka / Dotypos POS (API v2) MCP konektor nad openmcp_sdk — delegovaná OAuth autorizace, read-only, GDPR pseudonymizace."
requires-python = ">=3.12"
dependencies = [
  "openmcp-sdk>=0.4,<0.5",
  "fastmcp>=3.2,<4",
  "pydantic>=2.6,<3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "anyio>=4,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/.pytest_cache-dotykacka-mcp"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["connector"]
